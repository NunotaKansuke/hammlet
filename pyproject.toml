[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hammlet"
version = "0.1.0"
description = "Fast Fourier maps and seed searches for binary microlensing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hammlet contributors"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
generate = ["VBMicrolensing>=5"]
search = ["jax>=0.4"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.7"]
all = ["VBMicrolensing>=5", "jax>=0.4", "matplotlib>=3.7"]

[project.scripts]
hammlet = "hammlet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hammlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Keep the CI contract explicit so a Ruff release cannot silently enable new
# rule families and turn an unchanged revision red.
select = ["E4", "E7", "E9", "F"]
